name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $browserPath = Join-Path $env:GITHUB_WORKSPACE "playwright-browsers"
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserPath
          "PLAYWRIGHT_BROWSERS_PATH=$browserPath" >> $env:GITHUB_ENV
          python -m playwright install chromium
          if (-not (Test-Path $browserPath)) {
            throw "Playwright browser directory was not created: $browserPath"
          }
          Get-ChildItem $browserPath

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HuevoHelper main.py
          $browserPath = Join-Path $env:GITHUB_WORKSPACE "playwright-browsers"
          if (-not (Test-Path $browserPath)) {
            throw "Playwright browser directory is missing: $browserPath"
          }
          Copy-Item -Path $browserPath -Destination (Join-Path $env:GITHUB_WORKSPACE "dist\playwright-browsers") -Recurse -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HuevoHelper-Windows
          path: dist/**
          if-no-files-found: error
          retention-days: 14
