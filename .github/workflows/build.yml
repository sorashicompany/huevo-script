name: Build Windows apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "bottle.py"
      - "casino.py"
      - "requirements.txt"
      - "build.bat"
      - "README.md"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build clicker app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HuevoClicker main.py
      - name: Build bottle app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HuevoBottle bottle.py
      - name: Build casino app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HuevoCasino casino.py
      - name: Upload clicker app
        uses: actions/upload-artifact@v4
        with:
          name: HuevoClicker-Windows
          path: dist/HuevoClicker.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload bottle app
        uses: actions/upload-artifact@v4
        with:
          name: HuevoBottle-Windows
          path: dist/HuevoBottle.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload casino app
        uses: actions/upload-artifact@v4
        with:
          name: HuevoCasino-Windows
          path: dist/HuevoCasino.exe
          if-no-files-found: error
          retention-days: 14
